server:
  port: 8082

spring:
  application:
    name: opc-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/opc_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  mail:
    host: smtp.qq.com
    port: 465
    username:
    password:
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

opc:
  admin:
    session-hours: 12
  settings:
    encryption-secret: ${OPC_SETTINGS_SECRET:local-development-only}
    encryption-salt: ${OPC_SETTINGS_SALT:9f4c2d8a7b6e5f10}
  altcha:
    hmac-secret: ${ALTCHA_HMAC_SECRET:}
  auth:
    mail-enabled: false
    verification-code-minutes: 10
    resend-interval-seconds: 60
    session-days: 30

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
