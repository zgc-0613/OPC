limit_req_zone $binary_remote_addr zone=opc_admin_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=opc_ai_case:10m rate=20r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name findopc.online www.findopc.online;

    root /var/www/opc;
    index index.html;

    location = /admin {
        return 308 https://admin.findopc.online$request_uri;
    }

    location ^~ /admin/ {
        return 308 https://admin.findopc.online$request_uri;
    }

    location = /api/ai/case-analysis {
        limit_req zone=opc_ai_case burst=5 nodelay;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8082/api/ai/case-analysis;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 190s;
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/admin/auth/(login|register-request)$ {
        limit_req zone=opc_admin_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/findopc.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/findopc.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name findopc.online www.findopc.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.findopc.online;

    root /var/www/opc;
    index index.html;

    location = / {
        return 302 /admin/login;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /media/ {
        try_files $uri =404;
    }

    location = /api/ai/case-analysis {
        limit_req zone=opc_ai_case burst=5 nodelay;
        client_max_body_size 64k;

        proxy_pass http://127.0.0.1:8082/api/ai/case-analysis;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 190s;
        proxy_cache off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/admin/auth/(login|register-request)$ {
        limit_req zone=opc_admin_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        try_files /index.html =404;
    }

    location ^~ /admin/ {
        try_files $uri /index.html;
    }

    location / {
        return 302 https://findopc.online$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/admin.findopc.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.findopc.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name admin.findopc.online;

    root /var/www/opc;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
